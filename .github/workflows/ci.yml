name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar a aplicação Flask
        run: |
          python -m compileall -q app.py
          python -c "from app import app; resposta = app.test_client().get('/'); assert resposta.status_code == 200"

      - name: Construir a imagem Docker
        run: docker build --tag devops-atividade .
